server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m; # unggahan maksimum 5 MB (+ overhead multipart)

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:; frame-ancestors 'none'" always;

  # Satu origin untuk SPA dan API, jadi tanpa CORS.
  location /api/ {
    proxy_pass http://api:3030;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location /uploads/ { proxy_pass http://api:3030; }
  location /socket.io/ {
    proxy_pass http://api:3030;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
