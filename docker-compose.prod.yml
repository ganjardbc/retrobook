# Produksi: `docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build`
# Web di :${WEB_PORT}, admin di :${ADMIN_PORT}. Buat admin pertama dengan skrip admin:create (lihat README).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?isi di .env.production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-retrobook}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h localhost -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-retrobook}
      JWT_SECRET: ${JWT_SECRET:?isi di .env.production}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:8081}
      API_PORT: 3030
      UPLOAD_DIR: uploads
    volumes:
      - uploads:/app/apps/api/uploads
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://127.0.0.1:3030/api/health\").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build: { context: ., dockerfile: deploy/Dockerfile.web, args: { APP: web } }
    restart: unless-stopped
    depends_on: [api]
    ports: ['${WEB_PORT:-8080}:80']

  admin:
    build: { context: ., dockerfile: deploy/Dockerfile.web, args: { APP: admin } }
    restart: unless-stopped
    depends_on: [api]
    ports: ['${ADMIN_PORT:-8081}:80']

volumes:
  mysql-data:
  uploads:
